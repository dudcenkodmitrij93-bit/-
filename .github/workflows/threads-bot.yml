name: Threads bot

on:
  schedule:
    # 7 постов в день: 08:07, 10:07, 12:07, 14:07, 16:07, 18:07, 20:07 по Москве (UTC+3)
    - cron: "7 5,7,9,11,13,15,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threads-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish next post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TELEGRAM_URL: ${{ vars.TELEGRAM_URL }}
        run: python threads-bot/index.py
